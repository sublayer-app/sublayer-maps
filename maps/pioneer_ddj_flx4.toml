# Pioneer DJ DDJ-FLX4: built-in map (AL5-12 step 3), picked when a port whose name contains
# "DDJ-FLX4" connects. MIDI LEARN overrides single controls; MIDI panel -> PROFILE resets.
#
# Status: COMMUNITY (written from the manufacturer's documents, not yet tested on a DDJ-FLX4).
# Clean-room: every number is from AlphaTheta's own documents (research in
# _docs/controllers/pioneer.md); nothing from any other mapping.
#   F-ML  "DDJ-FLX4 List of MIDI messages" Ver 1.0 (2022), 5 pages
#   F-OM  DDJ-FLX4 Operating Instructions DRI1804A (2022)
# Port name: not stated in the documents; F-OM p.151 names the device "[DDJ-FLX4]".
#
# Channels (0-based, as stored here): deck 1 = 0, deck 2 = 1, browser and mixer = 6, deck 1
# pads = 7 (SHIFT 8), deck 2 pads = 9 (SHIFT 10) (F-ML p.1, p.3).
# Mapped (F-ML figure in brackets):
#   PLAY/PAUSE note 11 [1-1], CUE note 12 [1-2], BEAT SYNC note 88 [1-10; sent on release],
#   SHIFT note 63 [1-3] (lets go of the deck's held buttons, D-218), CH CUE (headphone cue) note 84 [3-6], TRIM 14-bit CC 4/36 [3-3], EQ HI 7/39, MID 11/43,
#   LOW 15/47 [3-4], CH FADER 19/51 [3-7], TEMPO 14-bit CC 0/32 [1-11; "-" side = min, the
#   pitch parameter's own direction, so not inverted], jog top touch note 54, jog top
#   rotate CC 34 (vinyl on) / 35 (vinyl off), jog side CC 33 [1-4; 0x41 up = clockwise, 0x3F
#   down = counter-clockwise: binary offset], LOAD 1 / 2 notes 70 / 71 [4-2, 4-3], BROWSE turn
#   CC 64 [4-1; 0x01 up clockwise, 0x7F down counter-clockwise: two's complement], BROWSE push
#   note 65, CROSSFADER 14-bit 31/63 [3-8], MASTER LEVEL 8/40 [3-1], HEADPHONE MIX 12/44
#   [3-11], HEADPHONE LEVEL 13/45 [3-12]; pads in HOT CUE mode notes 0-7 -> hot cues 1-8,
#   SHIFT + pad (SHIFT pad channel, same notes) -> clear that hot cue [5, p.3].
# Lights: the documents list MIDI-OUT on the same status and note for PLAY, CUE, BEAT SYNC,
#   CH CUE and the pads, OFF 0x00 / ON 0x7F (F-ML p.1-5).
# Not mapped (no Sublayer feature to drive): CFX (filter, ch 6 CC 23/55, 24/56), loop IN / OUT
#   / 4 BEAT EXIT / CUE LOOP CALL, BEAT FX (ch 4 / 5), SMART CFX, SMART FADER, MIC LEVEL,
#   MASTER CUE, pad modes other than HOT CUE (PAD FX, BEAT JUMP, SAMPLER, KEYBOARD, BEAT LOOP,
#   KEY SHIFT), the pad mode buttons, other SHIFT variants of the deck buttons (their functions are
#   the DJ software's; the documents give numbers, not meanings), fader start, BEAT SYNC long
#   press, the level meters and LOADED / VINYL MODE messages to the unit. No start-up message
#   (the documents define none). Jog ticks per turn: not in the documents (SET UP measures it).
format = 1
status = "community"
version = 1
name = "Pioneer DJ DDJ-FLX4"
sources = [
    "https://downloads.support.alphatheta.com/software_info/dj-controllers/DDJ-FLX4/DDJ-FLX4_MIDI_message_List_E1.pdf",
    "https://downloads.support.alphatheta.com/manuals/dj-controllers/DDJ-FLX4/DDJ-FLX4_DRI1804A_manual.pdf",
]
ports = ["DDJ-FLX4"]

[leds]
on = 127
off = 0

