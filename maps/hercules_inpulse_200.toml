# Hercules DJControl Inpulse 200: built-in map (AL5-12 step 3b), picked by its Device Inquiry
# reply (documented: maker 00 01 4E Guillemot, range 02 00, model 19 00). Not by port name: the
# port name isn't documented and the Inpulse 200 MK2 (no MIDI document found) would match it.
#
# Status: COMMUNITY (written from the manufacturer's documents, not yet tested on the device).
# Clean-room: every number is from Hercules' own documents (research in
# _docs/controllers/hercules.md); nothing from any other mapping.
#   H2-MC "List of MIDI commands - MIDI COMMANDS OF HERCULES DJCONTROL INPULSE 200" V1.0 (2021)
#   H2-UM DJControl Inpulse 200 User manual (EN, 2018)
#
# Channels (0-based, as stored here): global 0, deck A 1, deck B 2, deck A pads 6, deck B pads 7
#   (status 90 / 91 / 92 / 96 / 97). Buttons send 7F pressed, 00 released; LEDs take 7F on,
#   00 off on the same note. Knobs and faders are 14-bit (LSB = MSB + 0x20), "00 > 7F: Full
#   Left > Full Right". Encoders and jogs: "01 > 3F: CW", "7F > 40: CCW" (two's complement).
# Mapped (H2-MC page in brackets): PLAY 07, CUE 06, SYNC 05, PFL 0C, LOAD 0D, VINYL 03 (Sublayer's
#   VINYL), SHIFT 04 (lets go of the deck's held buttons, D-218) [p5-6, p10-11], VOL CC 00/20,
#   LOW 02/22, HIGH 04/24 (two-band EQ: no MID), GAIN 05/25, PITCH 08/28, JOG 09 and JOG_SCRATCH
#   0A (relative) [p16-19], JOG_TOUCH note 08 [p5-6]; pads, MODE1 (HOTCUE): notes 00-03 -> hot
#   cues 1-4, SHIFT + pad (note + 8) -> clear [p6-9, p11-13]; global: XFADER CC 00/20, BROWSE_ENC
#   CC 01, BROWSE_PUSH note 00, VOL_MASTER 03/23, VOL_HDP 04/24 [p4, p14-15].
# Not mapped: FILTER (no deck filter in Sublayer), LOOP IN / OUT, MODE buttons and the ROLL / FX
#   / SAMPLER pad modes, BEATMATCH_GUIDE, ASSISTANT, the energy ring and guide LEDs, the other
#   SHIFT notes (printed on status 94 for both decks: a document error to check), "B0 7F 7F"
#   (the status request: no start-up message is sent).
# Lights: PLAY, CUE, SYNC, PFL, VINYL and the pads, on the same notes (7F on, 00 off).
# TEMPO: which physical end sends 00 isn't stated; not inverted (00 = the parameter's "−"),
#   an assumption to confirm (checklist item 2). Jog ticks per turn: not documented.
format = 1
status = "community"
version = 1
name = "Hercules DJControl Inpulse 200"
sources = [
    "https://ts.hercules.com/download/sound/manuals/DJC_Inpulse200/DJControlInpulse200_MIDI_Commands_V_1_0.pdf",
    "https://ts.hercules.com/download/sound/manuals/DJC_Inpulse200/DJControl_Inpulse_200_User_Manual_EN.pdf",
]
ports = []

[inquiry]
manufacturer = "00 01 4E"
family = "02 00"
model = "19 00"

[leds]
on = 127
off = 0

