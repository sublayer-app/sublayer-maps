# Pioneer DJ DDJ-400: built-in map (AL5-12 step 3), picked when a port whose name contains
# "DDJ-400" connects. MIDI LEARN overrides single controls; MIDI panel -> PROFILE resets.
#
# Status: COMMUNITY (written from the manufacturer's documents, not yet tested on a DDJ-400).
# Clean-room: every number is from AlphaTheta's own documents (research in
# _docs/controllers/pioneer.md); nothing from any other mapping.
#   4-ML  "DDJ-400 List of MIDI messages version 1.00" (2018), 3 pages
#   4-OM  DDJ-400 Operating Instructions DRI1551B (2022)
# Port name: not stated in the documents; 4-OM p.21 names the device "[DDJ-400]".
#
# Channels (0-based, as stored here): deck 1 = 0, deck 2 = 1, browser and mixer = 6, deck 1
# pads = 7 (SHIFT 8), deck 2 pads = 9 (SHIFT 10) (4-ML p.1 "MIDI channel assignment").
# Mapped (4-ML figure in brackets):
#   PLAY/PAUSE note 11 [D1], CUE note 12 [D2], BEAT SYNC note 88 [D5; sent on release], SHIFT
#   + BEAT SYNC note 96 -> the pitch range (4-OM p.5-6: "Switches the variable range of
#   [TEMPO] slider"), SHIFT note 63 [D11] (lets go of the deck's held
#   buttons, D-218), CH CUE note 84 [M7], TRIM 14-bit CC 4/36 [M3], EQ HI 7/39 [M4], MID 11/43
#   [M5], LOW 15/47 [M6], CH FADER 19/51 [M2], TEMPO 14-bit CC 0/32 [D4; "-" side = min, the
#   pitch parameter's own direction, so not inverted], jog top touch note 54, jog top rotate
#   CC 34 (vinyl on) / 35 (vinyl off), jog side CC 33 [D3; 65 up clockwise, 63 down: binary
#   offset], LOAD left / right notes 70 / 71 [B2-L, B2-R], rotary selector CC 64 [B1; 1-30
#   clockwise, 127-98 counter-clockwise: two's complement], press note 65, CROSSFADER 14-bit
#   31/63 [M1], MASTER LEVEL 8/40 [M8], HEADPHONES MIXING 12/44 [M10], HEADPHONES LEVEL 13/45
#   [M11]; pads in HOT CUE mode notes 0-7 -> hot cues 1-8, SHIFT + pad (SHIFT pad channel,
#   same notes) -> clear that hot cue [p.2-3].
# Lights: MIDI-OUT on the same status and note for PLAY, CUE, BEAT SYNC, CH CUE and the pads,
#   OFF 0x00 / ON 0x7F (4-ML p.1-3).
# Not mapped (no Sublayer feature to drive): FILTER (ch 6 CC 23/55, 24/56), loop IN / 4BEAT,
#   OUT, RELOOP/EXIT, CUE LOOP CALL, BEAT FX (ch 4), MASTER CUE, pad modes other than HOT CUE
#   (BEAT LOOP, BEAT JUMP, SAMPLER, KEYBOARD, PAD FX, KEY SHIFT), the pad mode buttons, other
#   SHIFT variants of the deck buttons (the documents give numbers, not meanings), fader
#   start, BEAT SYNC long press, the level meter and the settings messages to the unit
#   (LOADED, VINYL MODE, FADER START, CROSSFADER REVERSE, CUT LAG, BACK SPIN). No start-up
#   message (the documents define none). Jog ticks per turn: not in the documents (SET UP
#   measures it).
format = 1
status = "community"
version = 1
name = "Pioneer DJ DDJ-400"
sources = [
    "https://downloads.support.alphatheta.com/software_info/dj-controllers/DDJ-400/DDJ-400_MIDI_Message_List_E1.pdf",
    "https://downloads.support.alphatheta.com/manuals/dj-controllers/DDJ-400/DDJ-400_DRI1551B_manual.pdf",
]
ports = ["DDJ-400"]

[leds]
on = 127
off = 0

