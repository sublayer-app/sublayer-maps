# Hercules DJControl Inpulse 500: built-in map (AL5-12 step 3b), picked when a port whose name
# contains "DJControl Inpulse 500" and not "MK2" connects (the port name isn't documented; the
# driver names use "DJControl Inpulse 500": checklist item 1).
#
# Status: COMMUNITY (written from the manufacturer's documents, not yet tested on the device).
# Clean-room: every number is from Hercules' own documents (research in
# _docs/controllers/hercules.md); nothing from any other mapping.
#   H5-MC "MIDI COMMANDS" DJControl Inpulse 500 (Guillemot, 2022), 14 pages
#   H5-UM DJControl Inpulse 500 User manual (EN, 2020)
#
# Channels (0-based, as stored here): global 0, deck A 1, deck B 2, deck A pads 6, deck B pads 7
#   (status 90 / 91 / 92 / 96 / 97). Buttons send 7F pressed, 00 released; LEDs take 7F on,
#   00 off on the same note. Knobs and faders are 14-bit (LSB = MSB + 0x20), "00 > 7F: Full
#   Left > Full Right". Encoders and jogs: "01 > 3F: CW", "7F > 40: CCW" (two's complement).
# Mapped (H5-MC page in brackets): Play 07, Cue 06, Sync 05, PFL 0C, Load 0D, Vinyl 03, Quant 02
#   (Sublayer's Q), Shift 04 (lets go of the deck's held buttons, D-218) [p1-2, p8, p10-11], volume CC 00/20,
#   Low 02/22, Mid 03/23, Hi 04/24, Gain 05/25, tempo fader 08/28 (MSB/LSB marked), jog "-"
#   CC 09 and jog "Vinyl" CC 0A (relative) [p1, p5-6, p10]; pads, Mode 1 (Hot Cue): notes 00-07
#   -> hot cues 1-8, SHIFT + pad (note + 8) -> clear [p2-5, p11-14]; mixer: crossfader CC 00/20,
#   browse encoder CC 01, browse push note 00, master 03/23, headphones 04/24, Cue-Master 05/25
#   [p5-8].
# Not mapped: the jog touch (printed as CC B1 08, which is the tempo fader's MSB: a document
#   error to check before mapping it), Filter, Slip, loop In / Out and the autoloop encoder, the
#   mode buttons and the other pad modes, FX1-4, mic and aux, crossfader curve, Assistant /
#   Guides, VU meters, backlights and the energy ring. No start-up message (none documented).
# Lights: PLAY, CUE, SYNC, PFL, VINYL, Q and the pads, on the same notes (7F on, 00 off).
# TEMPO: which physical end sends 00 isn't stated; not inverted (00 = the parameter's "−"),
#   an assumption to confirm (checklist item 2). Jog ticks per turn: not documented.
format = 1
status = "community"
version = 1
name = "Hercules DJControl Inpulse 500"
sources = [
    "https://ts.hercules.com/download/sound/manuals/DJC_Inpulse500/DJControlInpulse500_MIDI_Commands.pdf",
    "https://ts.hercules.com/download/sound/manuals/DJC_Inpulse500/DJControl_Inpulse_500_User_Manual_EN.pdf",
]
ports = ["DJControl Inpulse 500"]
exclude_ports = ["MK2", "MKII", "MK II"]

[leds]
on = 127
off = 0

