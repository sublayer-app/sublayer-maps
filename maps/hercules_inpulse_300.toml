# Hercules DJControl Inpulse 300: built-in map (AL5-12 step 3b), picked when a port whose name
# contains "DJControl Inpulse 300" and not "MK2" connects. The port name isn't documented (the
# driver names use "DJControl Inpulse 300"; checklist item 1); the Inpulse 300 MK2 has no MIDI
# document found, so it's excluded.
#
# Status: COMMUNITY (written from the manufacturer's documents, not yet tested on the device).
# Clean-room: every number is from Hercules' own documents (research in
# _docs/controllers/hercules.md); nothing from any other mapping.
#   H3-MC "List of MIDI commands - MIDI COMMANDS OF HERCULES DJCONTROL INPULSE 300" V1.2 (2019)
#   H3-UM DJControl Inpulse 300 User manual (EN, 2018)
#
# Channels (0-based, as stored here): global 0, deck A 1, deck B 2, deck A pads 6, deck B pads 7
#   (status 90 / 91 / 92 / 96 / 97). Buttons send 7F pressed, 00 released; LEDs take 7F on,
#   00 off on the same note. Knobs and faders are 14-bit (LSB = MSB + 0x20), "00 > 7F: Full
#   Left > Full Right". Encoders and jogs: "01 > 3F: CW", "7F > 40: CCW" (two's complement).
# Mapped (H3-MC page in brackets): PLAY 07, CUE 06, SYNC 05, PFL 0C, LOAD 0D, VINYL 03, QUANTIZE
#   02 (Sublayer's Q), SHIFT 04 (lets go of the deck's held buttons, D-218) [p5-6, p18-19], VOL
#   CC 00/20, LOW 02/22, MID 03/23, HIGH 04/24, GAIN 05/25, PITCH 08/28, JOG 09 and JOG_SCRATCH
#   0A (relative) [p32-33, p36-37], JOG_TOUCH note 08; pads, MODE1 (HOTCUE): notes 00-07 -> hot
#   cues 1-8, SHIFT + pad (note + 8) -> clear [p7-10, p20-23]; global: XFADER CC 00/20,
#   BROWSE_ENC CC 01, BROWSE_PUSH note 00, VOL_MASTER 03/23, VOL_HDP 04/24 [p4, p30-31].
# Not mapped: FILTER, FX_LVL, DRY_WET, PAD_FX, FX_ON / FX2_ON, SLIP, LOOP IN / OUT, the MODE
#   buttons and the other seven pad modes, JOG_PAD, BEATMATCH_GUIDE, ASSISTANT, VU meters,
#   guide LEDs and the energy ring, the other SHIFT notes (printed on 94 for both decks: a
#   document error to check). No start-up message (none documented).
# Lights: PLAY, CUE, SYNC, PFL, VINYL, Q and the pads, on the same notes (7F on, 00 off).
# TEMPO: which physical end sends 00 isn't stated; not inverted (00 = the parameter's "−"),
#   an assumption to confirm (checklist item 2). Jog ticks per turn: not documented.
format = 1
status = "community"
version = 1
name = "Hercules DJControl Inpulse 300"
sources = [
    "https://ts.hercules.com/download/sound/manuals/DJC_Inpulse300/DJControlInpulse300_MIDI_Commands_V_1_2.pdf",
    "https://ts.hercules.com/download/sound/manuals/DJC_Inpulse300/DJControl_Inpulse_300_User_Manual_EN.pdf",
]
ports = ["DJControl Inpulse 300"]
exclude_ports = ["MK2", "MKII", "MK II"]

[leds]
on = 127
off = 0

